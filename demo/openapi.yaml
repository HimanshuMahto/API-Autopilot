openapi: 3.0.3
info:
  title: Demo Shop API
  version: 1.0.0
  description: >
    A small e-commerce API used to demonstrate API Autopilot. Users can browse
    products, place orders, read their own orders, cancel them and delete them.
    A user must never be able to see or change another user's orders.
servers:
  - url: http://127.0.0.1:8765
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
    Product:
      type: object
      required: [id, name, price, stock]
      properties:
        id: {type: integer}
        name: {type: string}
        price: {type: number, minimum: 0}
        stock: {type: integer, minimum: 0}
    OrderCreate:
      type: object
      required: [product_id, quantity]
      additionalProperties: false
      properties:
        product_id: {type: integer}
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of units. Must be between 1 and 100.
    Order:
      type: object
      required: [id, product_id, quantity, total, status, owner]
      properties:
        id: {type: integer}
        product_id: {type: integer}
        quantity: {type: integer, minimum: 1}
        total: {type: number, minimum: 0}
        status: {type: string, enum: [placed, cancelled]}
        owner: {type: string}
    User:
      type: object
      required: [username]
      properties:
        username: {type: string}
paths:
  /me:
    get:
      operationId: getMe
      summary: Return the authenticated user.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /products:
    get:
      operationId: listProducts
      summary: List all products. Public.
      responses:
        '200':
          description: All products.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Product'}
  /products/{product_id}:
    get:
      operationId: getProduct
      summary: Get one product. Public.
      parameters:
        - {name: product_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404':
          description: No such product.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /orders:
    get:
      operationId: listOrders
      summary: List the authenticated user's own orders.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: The caller's orders.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Order'}
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      operationId: createOrder
      summary: Place an order. Total is price multiplied by quantity.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCreate'}
      responses:
        '201':
          description: Order placed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400':
          description: Invalid input.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: No such product.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /orders/{order_id}:
    parameters:
      - {name: order_id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getOrder
      summary: Get one of the caller's orders. Other users' orders return 404.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: No such order for this user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: deleteOrder
      summary: Delete one of the caller's orders.
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: Deleted.
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: No such order for this user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /orders/{order_id}/cancel:
    parameters:
      - {name: order_id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: cancelOrder
      summary: Cancel one of the caller's placed orders. Cancelling twice returns 409.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: The cancelled order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: No such order for this user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Order is already cancelled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
