[project]
name = "api-autopilot"
version = "0.1.0"
description = "An AI agent that explores your API like a curious QA engineer and turns confirmed bugs into replayable tests."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "groq>=1.7.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13",
    "typer>=0.12",
]

[project.optional-dependencies]
demo = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
autopilot = "autopilot.cli:app"

[dependency-groups]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
